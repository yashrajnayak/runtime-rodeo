<svg width="1400" height="780" viewBox="0 0 1400 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Runtime Rodeo architecture diagram</title>
  <desc id="desc">A static GitHub Pages deployment serves a browser game. The browser owns game state, local storage persistence, keyboard controls, and the visible play surface.</desc>
  <rect width="1400" height="780" fill="#05080B"/>
  <rect x="38" y="38" width="1324" height="704" rx="24" fill="#081016" stroke="#234856" stroke-width="2"/>
  <text x="92" y="118" fill="#EEF8F7" font-family="Menlo, Monaco, Consolas, monospace" font-size="52" font-weight="800">Runtime Rodeo</text>
  <text x="94" y="160" fill="#26D9FF" font-family="Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="700">static game architecture</text>
  <g stroke-width="2">
    <rect x="94" y="245" width="252" height="140" rx="12" fill="#0C1A22" stroke="#26D9FF"/>
    <text x="130" y="305" fill="#EEF8F7" font-family="Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="800">Players</text>
    <text x="130" y="346" fill="#9BB0B6" font-family="Menlo, Monaco, Consolas, monospace" font-size="18">team names, hotfixes, votes</text>
    <rect x="94" y="468" width="252" height="140" rx="12" fill="#0C1A22" stroke="#FFD21F"/>
    <text x="130" y="528" fill="#EEF8F7" font-family="Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="800">Host Browser</text>
    <text x="130" y="569" fill="#9BB0B6" font-family="Menlo, Monaco, Consolas, monospace" font-size="18">keyboard and controls</text>
    <rect x="548" y="245" width="304" height="140" rx="12" fill="#0C1A22" stroke="#72F05A"/>
    <text x="586" y="305" fill="#EEF8F7" font-family="Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="800">Browser Game</text>
    <text x="586" y="346" fill="#9BB0B6" font-family="Menlo, Monaco, Consolas, monospace" font-size="18">rounds, timer, scoring, chaos</text>
    <rect x="548" y="468" width="304" height="140" rx="12" fill="#0C1A22" stroke="#FF665E"/>
    <text x="586" y="528" fill="#EEF8F7" font-family="Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="800">Local Storage</text>
    <text x="586" y="569" fill="#9BB0B6" font-family="Menlo, Monaco, Consolas, monospace" font-size="18">scores and round snapshot</text>
    <rect x="1048" y="245" width="252" height="140" rx="12" fill="#0C1A22" stroke="#26D9FF"/>
    <text x="1084" y="305" fill="#EEF8F7" font-family="Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="800">GitHub Pages</text>
    <text x="1084" y="346" fill="#9BB0B6" font-family="Menlo, Monaco, Consolas, monospace" font-size="18">static hosting</text>
    <rect x="1048" y="468" width="252" height="140" rx="12" fill="#0C1A22" stroke="#FFD21F"/>
    <text x="1084" y="528" fill="#EEF8F7" font-family="Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="800">Actions</text>
    <text x="1084" y="569" fill="#9BB0B6" font-family="Menlo, Monaco, Consolas, monospace" font-size="18">copy static files, deploy</text>
    <path d="M346 315H526" stroke="#26D9FF" stroke-dasharray="10 8"/>
    <path d="M346 538H526" stroke="#FFD21F" stroke-dasharray="10 8"/>
    <path d="M700 385V452" stroke="#FF665E" stroke-dasharray="10 8"/>
    <path d="M852 315H1028" stroke="#72F05A" stroke-dasharray="10 8"/>
    <path d="M1174 452V397" stroke="#FFD21F" stroke-dasharray="10 8"/>
  </g>
  <text x="94" y="686" fill="#93A7AD" font-family="Menlo, Monaco, Consolas, monospace" font-size="20">No server. No database. No tracking. The whole game runs in the browser and deploys as static files.</text>
</svg>
